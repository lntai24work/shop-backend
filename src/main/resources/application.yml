spring:
  application:
    name: shop
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:shop}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # schema do Flyway quản lý, KHÔNG dùng update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Các cấu hình app.* (jwt, cloudinary, vnpay...) sẽ được thêm ở từng tính năng tương ứng
